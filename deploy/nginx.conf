# СтрAIтег: лендинги factory.straitegist.ru и vendors.straitegist.ru
# Установка: см. README.md, раздел «Запуск на своём сервере (Ubuntu + nginx)».
# Файл кладётся в /etc/nginx/sites-available/straitegist-landings
# HTTPS (порт 443) и редирект с http добавит certbot --nginx.

map $host $landing_index {
    vendors.straitegist.ru  /vendors/index.html;
    default                 /index.html;
}
map $host $landing_robots {
    vendors.straitegist.ru  /robots-vendors.txt;
    default                 /robots.txt;
}
map $host $landing_sitemap {
    vendors.straitegist.ru  /sitemap-vendors.xml;
    default                 /sitemap.xml;
}

server {
    listen 80;
    listen [::]:80;
    server_name factory.straitegist.ru vendors.straitegist.ru;

    root /var/www/straitegist-landings;
    index index.html;
    charset utf-8;

    # Служебные файлы репозитория наружу не отдаём
    location ~ ^/(\.git|\.gitignore|\.htaccess|README\.md|SEO\.md|deploy/) {
        return 404;
    }

    # Главная: производства или вендоры в зависимости от поддомена
    location = / {
        try_files $landing_index =404;
    }
    location = /robots.txt {
        try_files $landing_robots =404;
    }
    location = /sitemap.xml {
        try_files $landing_sitemap =404;
    }

    # Старый адрес /vendors/ -> vendors.straitegist.ru
    location ^~ /vendors {
        return 301 https://vendors.straitegist.ru/$is_args$args;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
