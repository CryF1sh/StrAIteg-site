# СтрAIтег: лендинги factory.straitegist.ru и vendors.straitegist.ru
# Копируется в /etc/nginx/sites-available/straitegist-landings ОДИН РАЗ, при первой установке.
# После этого certbot --nginx допишет сюда HTTPS. Больше этот файл не перезаписывайте:
# маршруты лежат в deploy/nginx-site.conf и deploy/nginx-maps.conf и обновляются через git pull.

include /var/www/straitegist-landings/deploy/nginx-maps.conf;

server {
    listen 80;
    listen [::]:80;
    server_name factory.straitegist.ru vendors.straitegist.ru;
    include /var/www/straitegist-landings/deploy/nginx-site.conf;
}
