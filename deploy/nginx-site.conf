# Маршруты лендингов. Подключается внутри server { } из /etc/nginx/sites-available/straitegist-landings.
# Обновляется вместе с репозиторием (git pull), копировать не нужно.

root /var/www/straitegist-landings;

# Сжатие текстовых файлов: HTML, CSS, JS, SVG, XML, TXT (на телефонах в 3–5 раз меньше трафика)
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/xml text/plain application/json application/ld+json;
index index.html;
charset utf-8;

# Служебные файлы репозитория наружу не отдаём
location ~ ^/(\.git|\.gitignore|\.htaccess|README\.md|SEO\.md|deploy/|i18n/) {
    return 404;
}

# Главная: производства или вендоры в зависимости от поддомена
location = / {
    add_header Cache-Control "no-cache";
    try_files $landing_index =404;
}
location = /robots.txt {
    try_files $landing_robots =404;
}
location = /sitemap.xml {
    try_files $landing_sitemap =404;
}
# Описание сервиса для нейросетей (llmstxt.org)
location = /llms.txt {
    default_type text/plain;
    try_files $landing_llms =404;
}

# Английская версия: /en/ на каждом поддомене
location = /en {
    return 301 /en/$is_args$args;
}
location = /en/ {
    add_header Cache-Control "no-cache";
    try_files $landing_en =404;
}

# Старый адрес /vendors/ -> vendors.straitegist.ru
location ^~ /vendors {
    return 301 https://vendors.straitegist.ru/$is_args$args;
}

# Стили и скрипты подключаются с номером версии (?v=...), поэтому их можно кэшировать надолго:
# новая версия — новый адрес, браузер сразу скачает её.
location ~ ^/assets/.+\.(css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
# Шрифты: не меняются, кэш на год. Картинки: на неделю
location ^~ /assets/fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
}

# HTML-страницы: браузер всегда проверяет свежесть (быстрый ответ 304, если не менялись)
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}
