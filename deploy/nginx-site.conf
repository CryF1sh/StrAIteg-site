# Маршруты лендингов. Подключается внутри server { } из /etc/nginx/sites-available/straitegist-landings.
# Обновляется вместе с репозиторием (git pull), копировать не нужно.

root /var/www/straitegist-landings;
index index.html;
charset utf-8;

# Служебные файлы репозитория наружу не отдаём
location ~ ^/(\.git|\.gitignore|\.htaccess|README\.md|SEO\.md|deploy/|i18n/) {
    return 404;
}

# Главная: производства или вендоры в зависимости от поддомена
location = / {
    try_files $landing_index =404;
}
location = /robots.txt {
    try_files $landing_robots =404;
}
location = /sitemap.xml {
    try_files $landing_sitemap =404;
}
# Описание сервиса для нейросетей (llmstxt.org)
location = /llms.txt {
    default_type text/plain;
    try_files $landing_llms =404;
}

# Английская версия: /en/ на каждом поддомене
location = /en {
    return 301 /en/$is_args$args;
}
location = /en/ {
    try_files $landing_en =404;
}

# Старый адрес /vendors/ -> vendors.straitegist.ru
location ^~ /vendors {
    return 301 https://vendors.straitegist.ru/$is_args$args;
}

# Стили и скрипт: браузер проверяет свежесть при каждом заходе (ответ 304, если не менялись)
location ~ ^/assets/.+\.(css|js)$ {
    add_header Cache-Control "no-cache";
}
# Шрифты и картинки: кэш на неделю
location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
}

location / {
    try_files $uri $uri/ =404;
}
