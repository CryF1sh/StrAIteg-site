# Выбор файлов по поддомену. Подключается из /etc/nginx/sites-available/straitegist-landings.
# Обновляется вместе с репозиторием (git pull), копировать не нужно.

map $host $landing_index {
    vendors.straitegist.ru  /vendors/index.html;
    default                 /index.html;
}
map $host $landing_robots {
    vendors.straitegist.ru  /robots-vendors.txt;
    default                 /robots.txt;
}
map $host $landing_sitemap {
    vendors.straitegist.ru  /sitemap-vendors.xml;
    default                 /sitemap.xml;
}
